<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="848" viewBox="0 0 1280 848" role="img" aria-label="05 · 用户连接与发现能力"><title>05 · 用户连接与发现能力</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#526b80"/></marker><marker id="open" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#526b80"/></marker><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20384b}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#607589}.label{font-size:14px}.small{font-size:12px;fill:#607589}.heading{font-size:17px;font-weight:700}.line{fill:none;stroke:#526b80;stroke-width:1.6;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}.lifeline{stroke:#c2d0db;stroke-width:1.3;stroke-dasharray:6 5}</style></defs><rect width="1280" height="848" fill="#f5f8fb"/><text x="35" y="44" class="title">05 · 用户连接与发现能力</text><text x="35" y="73" class="sub">UML 时序图 · 实线为请求或处理，虚线为返回</text><rect x="28" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="44" y="133" class="heading">Agent</text><line x1="110" y1="155" x2="110" y2="778" class="lifeline"/><rect x="373" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="389" y="133" class="heading">Gateway</text><line x1="455" y1="155" x2="455" y2="778" class="lifeline"/><rect x="718" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="734" y="133" class="heading">身份 / 授权组件</text><line x1="800" y1="155" x2="800" y2="778" class="lifeline"/><rect x="1063" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="1079" y="133" class="heading">MCP Runtime</text><line x1="1145" y1="155" x2="1145" y2="778" class="lifeline"/><path class="line" d="M110 195 H455"/><text x="282.5" y="184" text-anchor="middle" class="label">POST /mcp/能力组：initialize 或 tools/list</text><path class="line" d="M455 262 H800"/><text x="627.5" y="251" text-anchor="middle" class="label">验证用户身份并映射统一 Caller</text><path class="line dashed" d="M800 329 H455"/><text x="627.5" y="318" text-anchor="middle" class="label">可信组织、来源、用户及角色</text><path class="line" d="M455 396 H800"/><text x="627.5" y="385" text-anchor="middle" class="label">对当前快照过滤显式授权工具</text><path class="line dashed" d="M800 463 H455"/><text x="627.5" y="452" text-anchor="middle" class="label">当前用户可见工具标识集合</text><path class="line" d="M455 530 H1145"/><text x="800" y="519" text-anchor="middle" class="label">移除用户凭据；附带请求绑定签名</text><path class="line" d="M1145 597 h40 v24 h-40"/><text x="1000" y="587" class="label" text-anchor="middle">验证签名、有效期、重放与快照版本</text><path class="line" d="M1145 664 h40 v24 h-40"/><text x="1000" y="654" class="label" text-anchor="middle">生成工具别名、定义与权限一致的说明</text><path class="line dashed" d="M1145 731 H110"/><text x="627.5" y="720" text-anchor="middle" class="label">JSON-RPC 结果经网关返回</text><rect x="25" y="790" width="1230" height="39" rx="8" fill="#e6efeb"/><text x="42" y="815" class="small">调用者不能靠请求头伪造身份；未获授权的工具不会出现在列表或自动说明中。</text></svg>
