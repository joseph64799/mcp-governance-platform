<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="848" viewBox="0 0 1280 848" role="img" aria-label="04 · 授权与撤权"><title>04 · 授权与撤权</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#526b80"/></marker><marker id="open" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#526b80"/></marker><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20384b}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#607589}.label{font-size:14px}.small{font-size:12px;fill:#607589}.heading{font-size:17px;font-weight:700}.line{fill:none;stroke:#526b80;stroke-width:1.6;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}.lifeline{stroke:#c2d0db;stroke-width:1.3;stroke-dasharray:6 5}</style></defs><rect width="1280" height="848" fill="#f5f8fb"/><text x="35" y="44" class="title">04 · 授权与撤权</text><text x="35" y="73" class="sub">UML 时序图 · 实线为请求或处理，虚线为返回</text><rect x="28" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="44" y="133" class="heading">管理员</text><line x1="110" y1="155" x2="110" y2="778" class="lifeline"/><rect x="373" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="389" y="133" class="heading">Admin / 目录</text><line x1="455" y1="155" x2="455" y2="778" class="lifeline"/><rect x="718" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="734" y="133" class="heading">Gateway</text><line x1="800" y1="155" x2="800" y2="778" class="lifeline"/><rect x="1063" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="1079" y="133" class="heading">MCP Runtime</text><line x1="1145" y1="155" x2="1145" y2="778" class="lifeline"/><path class="line" d="M110 195 H455"/><text x="282.5" y="184" text-anchor="middle" class="label">绑定组织、来源、用户或角色、工具修订</text><path class="line" d="M455 262 h40 v24 h-40"/><text x="515" y="252" class="label" text-anchor="middle">验证已发布修订及可选能力组作用域</text><path class="line dashed" d="M455 329 H110"/><text x="282.5" y="318" text-anchor="middle" class="label">保存新快照版本</text><path class="line" d="M800 396 H455"/><text x="627.5" y="385" text-anchor="middle" class="label">周期刷新授权快照</text><path class="line" d="M1145 463 H455"/><text x="800" y="452" text-anchor="middle" class="label">周期刷新目录快照</text><path class="line" d="M110 530 H455"/><text x="282.5" y="519" text-anchor="middle" class="label">撤销指定授权</text><path class="line" d="M455 597 h40 v24 h-40"/><text x="515" y="587" class="label" text-anchor="middle">持久化不再包含该授权的新快照</text><path class="line" d="M800 664 H455"/><text x="627.5" y="653" text-anchor="middle" class="label">下次刷新取得撤权结果</text><path class="line" d="M800 731 h40 v24 h-40"/><text x="860" y="721" class="label" text-anchor="middle">新列表隐藏工具；旧列表发起的调用拒绝</text><rect x="25" y="790" width="1230" height="39" rx="8" fill="#e6efeb"/><text x="42" y="815" class="small">默认刷新周期约 2 秒、租约 15 秒。控制面不可用至租约过期后拒绝继续准入。</text></svg>
