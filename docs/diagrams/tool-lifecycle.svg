<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="635" viewBox="0 0 1020 635" role="img" aria-label="UML · 工具生命周期"><title>UML · 工具生命周期</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#526b80"/></marker><marker id="open" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#526b80"/></marker><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20384b}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#607589}.label{font-size:14px}.small{font-size:12px;fill:#607589}.heading{font-size:17px;font-weight:700}.line{fill:none;stroke:#526b80;stroke-width:1.6;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}.lifeline{stroke:#c2d0db;stroke-width:1.3;stroke-dasharray:6 5}</style></defs><rect width="1020" height="635" fill="#f5f8fb"/><text x="35" y="44" class="title">UML · 工具生命周期</text><text x="35" y="73" class="sub">状态与授权分别维护；恢复、变更和再发现都需要明确治理决策</text><rect x="55" y="160" width="255" height="105" rx="10" fill="#fff8e8" stroke="#c3d3df"/><text x="71" y="188" class="heading">PENDING · 待审核</text><text x="71" y="215" class="label">发现新增 / 定义修改</text><text x="71" y="238" class="label">不出现在用户工具列表</text><rect x="480" y="160" width="255" height="105" rx="10" fill="#e3f2eb" stroke="#c3d3df"/><text x="496" y="188" class="heading">PUBLISHED · 已发布</text><text x="496" y="215" class="label">仍须显式授权当前修订</text><text x="496" y="238" class="label">按用户过滤列表与调用</text><rect x="480" y="410" width="255" height="105" rx="10" fill="#f3eafa" stroke="#c3d3df"/><text x="496" y="438" class="heading">DISABLED · 已停用</text><text x="496" y="465" class="label">管理员主动停用</text><text x="496" y="488" class="label">重新发布须显式操作</text><rect x="55" y="410" width="255" height="105" rx="10" fill="#fbeaea" stroke="#c3d3df"/><text x="71" y="438" class="heading">REMOVED · 已移除</text><text x="71" y="465" class="label">完整同步确认删除</text><text x="71" y="488" class="label">服务配置变更后待重新发现</text><path class="line" d="M310 206 H480"/><text x="395" y="192" class="small" text-anchor="middle">管理员审核发布</text><path class="line" d="M607 265 V410"/><text x="672" y="340" class="small" text-anchor="middle">管理员停用</text><path class="line" d="M735 460 H825 V215 H735"/><text x="864" y="340" class="small" text-anchor="middle">重新发布</text><path class="line" d="M480 460 H310"/><text x="395" y="446" class="small" text-anchor="middle">同步确认删除</text><path class="line dashed" d="M480 182 H415 V110 H182 V160"/><text x="550" y="102" class="small" text-anchor="middle">定义改变：修订增加，原授权失效</text><path class="line" d="M182 265 V410"/><text x="260" y="346" class="small" text-anchor="middle">同步确认删除</text><path class="line dashed" d="M55 460 H20 V210 H55"/><path class="line" d="M480 240 H370 V387 H182 V410"/><text x="370" y="375" class="small">完整发现确认删除</text><text x="40" y="569" class="label">重新出现 → 待审核，修订增加。分页失败 / 超时 → 状态不变，不删除目录。</text><text x="40" y="601" class="label">分组调整不改变工具状态，也不隐式授权；资源权限语义变更同样增加修订。</text></svg>
