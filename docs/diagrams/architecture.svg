<svg xmlns="http://www.w3.org/2000/svg" width="1335" height="865" viewBox="0 0 1335 865" role="img" aria-label="MCP 治理平台 · 总体架构"><title>MCP 治理平台 · 总体架构</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#526b80"/></marker><marker id="open" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#526b80"/></marker><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20384b}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#607589}.label{font-size:14px}.small{font-size:12px;fill:#607589}.heading{font-size:17px;font-weight:700}.line{fill:none;stroke:#526b80;stroke-width:1.6;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}.lifeline{stroke:#c2d0db;stroke-width:1.3;stroke-dasharray:6 5}</style></defs><rect width="1335" height="865" fill="#f5f8fb"/><text x="35" y="44" class="title">MCP 治理平台 · 总体架构</text><text x="35" y="73" class="sub">一个 Maven 父工程 · 四个 Spring 启动工程 · 自研网关、发现与治理</text><rect x="25" y="112" width="1270" height="375" rx="14" fill="#eaf3f1"/><text x="45" y="140" class="small">调用面 · 用户请求不逐次同步访问管理服务</text><rect x="25" y="535" width="1270" height="240" rx="14" fill="#edf1f8"/><text x="45" y="560" class="small">管理面 · 目录、分组和授权统一版本化</text><rect x="50" y="185" width="215" height="135" rx="10" fill="#fff" stroke="#c3d3df"/><text x="66" y="213" class="heading">运营用户 / Agent</text><text x="66" y="240" class="label">统一 MCP 入口</text><text x="66" y="263" class="label">每个人看到自己的工具</text><rect x="345" y="170" width="250" height="155" rx="10" fill="#fff" stroke="#c3d3df"/><text x="361" y="198" class="heading">Gateway 网关</text><text x="361" y="225" class="label">身份认证 · 中央授权</text><text x="361" y="248" class="label">列表过滤 · 调用校验</text><text x="361" y="271" class="label">请求绑定签名</text><rect x="705" y="170" width="250" height="155" rx="10" fill="#fff" stroke="#c3d3df"/><text x="721" y="198" class="heading">MCP Runtime</text><text x="721" y="225" class="label">逻辑能力组 · 用户说明</text><text x="721" y="248" class="label">校验签名及快照版本</text><text x="721" y="271" class="label">参数校验 · 上游转接</text><rect x="1060" y="170" width="210" height="155" rx="10" fill="#fff" stroke="#c3d3df"/><text x="1076" y="198" class="heading">业务 MCP 服务</text><text x="1076" y="225" class="label">服务 A / B / C …</text><text x="1076" y="248" class="label">只信任平台接入身份</text><text x="1076" y="271" class="label">复用原业务 API</text><rect x="345" y="365" width="250" height="90" rx="10" fill="#fff" stroke="#c3d3df"/><text x="361" y="393" class="heading">认证 / 授权适配器</text><text x="361" y="420" class="label">JWT、企业身份、资源权限</text><rect x="705" y="365" width="250" height="90" rx="10" fill="#fff" stroke="#c3d3df"/><text x="721" y="393" class="heading">审计扩展接口</text><text x="721" y="420" class="label">接入、变更、准入和执行</text><rect x="50" y="585" width="255" height="145" rx="10" fill="#fff" stroke="#c3d3df"/><text x="66" y="613" class="heading">Admin 管理后台</text><text x="66" y="640" class="label">接入配置 · 工具审核</text><text x="66" y="663" class="label">能力分组 · 用户 / 角色授权</text><text x="66" y="686" class="label">初始管理页面</text><rect x="485" y="585" width="380" height="145" rx="10" fill="#fff" stroke="#c3d3df"/><text x="501" y="613" class="heading">版本化目录 / 策略快照</text><text x="501" y="640" class="label">服务、工具修订、分组、显式授权</text><text x="501" y="663" class="label">初始实现：单写者 + 原子文件落盘</text><text x="501" y="686" class="label">消费者后台刷新 · 过期拒绝请求</text><rect x="1040" y="585" width="230" height="145" rx="10" fill="#fff" stroke="#c3d3df"/><text x="1056" y="613" class="heading">Discovery 发现</text><text x="1056" y="640" class="label">MCP 初始化 + 分页列表</text><text x="1056" y="663" class="label">全量成功才提交观察</text><text x="1056" y="686" class="label">新增 / 修改待发布</text><path class="line" d="M265 240 H345"/><text x="304" y="225" class="small" text-anchor="middle">Bearer 身份</text><path class="line" d="M595 240 H705"/><text x="650" y="225" class="small" text-anchor="middle">受签名保护的请求</text><path class="line" d="M950 240 H1060"/><text x="1005" y="225" class="small" text-anchor="middle">服务专用凭据</text><path class="line" d="M470 365 V325"/><path class="line dashed" d="M830 325 V365"/><text x="854" y="349" class="small" text-anchor="middle">审计</text><path class="line" d="M305 650 H485"/><text x="395" y="633" class="small" text-anchor="middle">管理操作</text><path class="line" d="M1040 650 H865"/><text x="952" y="633" class="small" text-anchor="middle">完整观察报告</text><path class="line" d="M1270 650 H1308 V240 H1270"/><path class="line dashed" d="M590 585 V510 H625 V290 H595"/><text x="660" y="492" class="small" text-anchor="middle">后台刷新</text><path class="line dashed" d="M815 585 V485 H990 V290 H950"/><text x="1009" y="492" class="small" text-anchor="middle">后台刷新</text><text x="40" y="811" class="label">四个独立启动器；公共库复用协议与安全能力。发现 ≠ 发布，分组 ≠ 授权，列表过滤 ≠ 调用授权。</text><text x="40" y="838" class="small">平台调用受快照租约约束；撤权存在短暂传播窗口，已发出的业务请求不能被追溯撤回。</text></svg>
