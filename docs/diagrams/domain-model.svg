<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="950" viewBox="0 0 1280 950" role="img" aria-label="UML · 领域模型"><title>UML · 领域模型</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#526b80"/></marker><marker id="open" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#526b80"/></marker><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20384b}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#607589}.label{font-size:14px}.small{font-size:12px;fill:#607589}.heading{font-size:17px;font-weight:700}.line{fill:none;stroke:#526b80;stroke-width:1.6;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}.lifeline{stroke:#c2d0db;stroke-width:1.3;stroke-dasharray:6 5}</style></defs><rect width="1280" height="950" fill="#f5f8fb"/><text x="35" y="44" class="title">UML · 领域模型</text><text x="35" y="73" class="sub">认证身份、目录、能力分组、授权和内部执行上下文保持独立</text><rect x="45" y="120" width="280" height="145" rx="10" fill="#fff" stroke="#c3d3df"/><text x="61" y="148" class="heading">ServiceRegistration</text><text x="61" y="175" class="label">id / tenant / endpoint</text><text x="61" y="198" class="label">transport / credentialRef</text><text x="61" y="221" class="label">enabled</text><rect x="430" y="120" width="325" height="190" rx="10" fill="#fff" stroke="#c3d3df"/><text x="446" y="148" class="heading">ToolEntry</text><text x="446" y="175" class="label">id / serviceId / tenant</text><text x="446" y="198" class="label">upstreamName / inputSchema</text><text x="446" y="221" class="label">fingerprint / revision / state</text><text x="446" y="244" class="label">resourceProtected / metadata</text><rect x="900" y="120" width="335" height="165" rx="10" fill="#fff" stroke="#c3d3df"/><text x="916" y="148" class="heading">CapabilityGroup</text><text x="916" y="175" class="label">id / tenant / title / description</text><text x="916" y="198" class="label">tools: alias → toolId</text><text x="916" y="221" class="label">同一工具可跨组复用</text><rect x="45" y="420" width="280" height="155" rx="10" fill="#fff" stroke="#c3d3df"/><text x="61" y="448" class="heading">Caller</text><text x="61" y="475" class="label">subject / issuer / tenant</text><text x="61" y="498" class="label">roles: Set&lt;String&gt;</text><text x="61" y="521" class="label">外部身份先映射到平台身份</text><rect x="430" y="425" width="325" height="180" rx="10" fill="#fff" stroke="#c3d3df"/><text x="446" y="453" class="heading">Grant</text><text x="446" y="480" class="label">tenant / issuer / subjectType</text><text x="446" y="503" class="label">subject / toolId / toolRevision</text><text x="446" y="526" class="label">groupId: 可选作用域</text><text x="446" y="549" class="label">绑定明确工具修订</text><rect x="900" y="430" width="335" height="160" rx="10" fill="#fff" stroke="#c3d3df"/><text x="916" y="458" class="heading">InvocationPermit</text><text x="916" y="485" class="label">caller / groupId / snapshotVersion</text><text x="916" y="508" class="label">allowedToolIds / requestHash</text><text x="916" y="531" class="label">nonce / issuedAt / expiresAt</text><rect x="430" y="715" width="325" height="150" rx="10" fill="#fff" stroke="#c3d3df"/><text x="446" y="743" class="heading">Snapshot</text><text x="446" y="770" class="label">version / updatedAt</text><text x="446" y="793" class="label">services / tools / groups / grants</text><text x="446" y="816" class="label">完整不可变视图</text><rect x="900" y="715" width="335" height="150" rx="10" fill="#fff" stroke="#c3d3df"/><text x="916" y="743" class="heading">DiscoveryReport</text><text x="916" y="770" class="label">serviceId / registrationHash</text><text x="916" y="793" class="label">complete / observedTools</text><text x="916" y="816" class="label">仅成功完整观察可提交</text><path class="line" d="M325 190 H430"/><text x="377" y="178" class="small" text-anchor="middle">1 提供 0..*</text><path class="line" d="M900 205 H755"/><text x="827" y="194" class="small" text-anchor="middle">* 聚合 *</text><path class="line" d="M590 425 V310"/><text x="685" y="368" class="small" text-anchor="middle">* 授权当前修订 1</text><path class="line dashed" d="M325 500 H430"/><text x="377" y="487" class="small" text-anchor="middle">匹配用户 / 角色</text><path class="line dashed" d="M755 500 H900"/><text x="827" y="484" class="small" text-anchor="middle">网关签发执行上下文</text><path class="line" d="M1067 430 V285"/><text x="1130" y="363" class="small" text-anchor="middle">1 绑定能力组</text><path class="line" d="M590 715 V605"/><text x="620" y="663" class="small" text-anchor="middle">包含</text><path class="line" d="M900 790 H755"/><text x="827" y="776" class="small" text-anchor="middle">提交目录观察</text><text x="45" y="913" class="label">修订是当前定义的版本计数；初始版本不提供完整历史定义存档或回滚。角色目录由身份系统提供。</text></svg>
