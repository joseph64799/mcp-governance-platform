<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="848" viewBox="0 0 1280 848" role="img" aria-label="07 · 越权与绕过拦截"><title>07 · 越权与绕过拦截</title><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L8,4 L0,8" fill="#526b80"/></marker><marker id="open" markerWidth="11" markerHeight="11" refX="9" refY="5" orient="auto"><path d="M1,1 L9,5 L1,9" fill="none" stroke="#526b80"/></marker><style>text{font-family:Arial,"Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#20384b}.title{font-size:27px;font-weight:700}.sub{font-size:14px;fill:#607589}.label{font-size:14px}.small{font-size:12px;fill:#607589}.heading{font-size:17px;font-weight:700}.line{fill:none;stroke:#526b80;stroke-width:1.6;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 5}.lifeline{stroke:#c2d0db;stroke-width:1.3;stroke-dasharray:6 5}</style></defs><rect width="1280" height="848" fill="#f5f8fb"/><text x="35" y="44" class="title">07 · 越权与绕过拦截</text><text x="35" y="73" class="sub">UML 时序图 · 实线为请求或处理，虚线为返回</text><rect x="28" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="44" y="133" class="heading">调用者</text><line x1="110" y1="155" x2="110" y2="778" class="lifeline"/><rect x="373" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="389" y="133" class="heading">Gateway</text><line x1="455" y1="155" x2="455" y2="778" class="lifeline"/><rect x="718" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="734" y="133" class="heading">MCP Runtime</text><line x1="800" y1="155" x2="800" y2="778" class="lifeline"/><rect x="1063" y="105" width="164" height="50" rx="10" fill="#e9f1f6" stroke="#c3d3df"/><text x="1079" y="133" class="heading">业务 MCP</text><line x1="1145" y1="155" x2="1145" y2="778" class="lifeline"/><path class="line" d="M110 195 H455"/><text x="282.5" y="184" text-anchor="middle" class="label">缺失或无效身份</text><path class="line dashed" d="M455 262 H110"/><text x="282.5" y="251" text-anchor="middle" class="label">401，停止转发</text><path class="line" d="M110 329 H455"/><text x="282.5" y="318" text-anchor="middle" class="label">猜测工具名、跨组调用、持旧列表调用</text><path class="line" d="M455 396 h40 v24 h-40"/><text x="515" y="386" class="label" text-anchor="middle">校验当前工具修订、组织、来源和授权</text><path class="line dashed" d="M455 463 H110"/><text x="282.5" y="452" text-anchor="middle" class="label">403，后端不执行</text><path class="line" d="M110 530 H455"/><text x="282.5" y="519" text-anchor="middle" class="label">伪造内部执行许可请求头</text><path class="line" d="M455 597 h40 v24 h-40"/><text x="515" y="587" class="label" text-anchor="middle">丢弃伪造许可，仅以真实身份重新判定</text><path class="line" d="M110 664 H800"/><text x="455" y="653" text-anchor="middle" class="label">尝试绕过网关直接访问 Runtime</text><path class="line dashed" d="M800 731 H110"/><text x="455" y="720" text-anchor="middle" class="label">无合法签名 / 过期 / 重放 → 401</text><rect x="25" y="790" width="1230" height="39" rx="8" fill="#e6efeb"/><text x="42" y="815" class="small">业务 MCP 必须限制直连并校验平台凭据；否则平台之外的入口仍可绕过治理。</text></svg>
